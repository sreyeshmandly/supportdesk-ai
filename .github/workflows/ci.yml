name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: supportdesk_test
          MYSQL_USER: supportdesk_app
          MYSQL_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Load database schema
        run: mysql -h 127.0.0.1 -u supportdesk_app -pci-only-password supportdesk_test < database/schema.sql

      - name: Run tests
        working-directory: server
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: supportdesk_app
          DB_PASSWORD: ci-only-password
          DB_NAME: supportdesk_test
        run: npm test